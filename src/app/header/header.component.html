<!-- HEADER NAVBAR -->
<nav
  class="sticky top-0 z-50 h-[72px] w-full bg-gradient-to-r from-indigo-700 to-blue-950 text-white shadow-lg sm:h-[88px]">

  <div class="mx-auto flex h-full max-w-[1600px] items-center justify-between gap-3 px-3 sm:px-6 lg:px-8">

    <!-- LOGO -->
    <div class="shrink-0">
      <h1 class="font-mono text-2xl font-black sm:text-3xl">
        Zentro<span class="text-indigo-300">.</span>
      </h1>

      <p class="hidden text-xs text-indigo-100 sm:block">
        Shop smart. Live better.
      </p>
    </div>

    <!-- ACTIONS -->
    <div class="flex shrink-0 items-center gap-3 sm:gap-5">

      <span class="cursor-pointer text-xl sm:text-2xl">♡</span>

      <span class="cursor-pointer text-xl sm:text-2xl">🛒</span>

      <!-- PROFILE -->
      <div class="relative flex h-8 w-8 items-center justify-center rounded-full bg-indigo-400 sm:h-9 sm:w-9">

        <img
          class="h-full w-full cursor-pointer rounded-full object-cover"
          src="../../assets/profile-icon.png"
          alt="Profile"
          (click)="showProfile = !showProfile" />

        <!-- ACCOUNT POPUP -->
        <div
          *ngIf="showProfile"
          class="absolute right-0 top-11 z-50 w-72 rounded-xl border border-gray-200 bg-white p-5 text-slate-800 shadow-xl">

          <h3 class="mb-4 text-lg font-bold">My Account</h3>

          <p class="mb-3 text-sm">
            <strong>Name:</strong> {{ userDetails?.fullName }}
          </p>

          <p class="mb-3 break-all text-sm">
            <strong>Email:</strong> {{ userDetails?.email }}
          </p>

          <p class="mb-4 text-sm">
            <strong>Phone:</strong> {{ userDetails?.phone }}
          </p>

          <button
            type="button"
            (click)="logout()"
            class="w-full rounded-lg bg-red-600 px-4 py-2 font-semibold text-white hover:bg-red-700">
            Logout
          </button>

        </div>

      </div>

    </div>

  </div>
</nav>
